name: Code QA Tumble Code

on:
    workflow_dispatch:
    push:
        branches: [main]
    pull_request:
        types: [opened, reopened, ready_for_review, synchronize]
        branches: [main]

# Read-only token: the install step hands it to dependency install scripts
# (see .github/actions/setup-node-pnpm), and no job here writes to the repo.
permissions:
    contents: read

jobs:
    check-translations:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
            - name: Setup Node.js and pnpm
              uses: ./.github/actions/setup-node-pnpm
            - name: Verify all translations are complete
              run: node scripts/find-missing-translations.js

    knip:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
            - name: Setup Node.js and pnpm
              uses: ./.github/actions/setup-node-pnpm
            - name: Run knip checks
              run: pnpm knip
            # The dead-code helpers knip does not cover (scripts/find-test-only-exports.mjs and
            # scripts/check-unused-locals.mjs, the latter runs in src's check-types).
            - name: Test the dead-code scripts
              run: node --test 'scripts/__tests__/*.test.mjs'

    compile:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
            - name: Setup Node.js and pnpm
              uses: ./.github/actions/setup-node-pnpm
            - name: Lint
              run: pnpm lint
            - name: Check types
              run: pnpm check-types
            # The webview bundle must not ship extension-only code (src/core,
            # src/services, ...) or import "vscode"; a Vite plugin fails the build
            # if it does. Types were checked above, so only the bundling runs here.
            - name: Build webview (bundle boundary guard)
              run: pnpm --filter @roo-code/vscode-webview exec vite build

    # The CLI's stdin stream protocol end to end (apps/cli/scripts/integration):
    # the real CLI and extension bundle answer the cases' prompts through the
    # hidden fake-ai provider (the scripted model in lib/fake-model.ts), so the
    # job needs no network access to a model and no API key. Linux only.
    cli-integration:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - name: Checkout code
              uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
            - name: Setup Node.js and pnpm
              uses: ./.github/actions/setup-node-pnpm
            # The CLI loads the extension from src/dist/extension.js.
            - name: Build the extension bundle
              run: pnpm turbo run bundle --filter=tumble-code
            - name: Run the CLI integration suite
              run: pnpm --filter @tumble-code/cli test:integration

    unit-test:
        name: platform-unit-test (${{ matrix.name }})
        runs-on: ${{ matrix.os }}
        strategy:
            # A Windows failure used to cancel the Ubuntu run, which left main
            # without any unit-test result at all.
            fail-fast: false
            matrix:
                include:
                    - os: windows-latest
                      name: windows-a
                    - os: windows-latest
                      name: windows-b
                    - os: windows-latest
                      name: windows-c
        steps:
            - name: Checkout code
              uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
            - name: Setup Node.js and pnpm
              uses: ./.github/actions/setup-node-pnpm
            - name: Debug temp dir short names
              shell: bash
              run: |
                  echo "TEMP=$TEMP TMP=$TMP"
                  node -e "const fs=require('fs'),os=require('os');console.log('tmpdir', os.tmpdir());console.log('realpathSync', fs.realpathSync(os.tmpdir()));console.log('realpathSync.native', fs.realpathSync.native(os.tmpdir()));fs.promises.realpath(os.tmpdir()).then(p=>console.log('promises.realpath', p))"
            - name: Run unit tests
              env:
                  VITEST_JSON_REPORT: vitest-report.json
              # --continue: turbo otherwise stops at the first failing package,
              # so every run showed one package's failures and hid the rest.
              # --log-prefix none: turbo otherwise starts every line with
              # "<package>:test: ", and GitHub only turns "::error" into an
              # annotation at the start of a line, so vitest's per-test
              # annotations were dropped. --log-order grouped already wraps
              # each package's output in its own ::group:: section.
              run: pnpm test --continue --log-prefix none
            - name: Upload vitest report
              if: always()
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: vitest-report-${{ matrix.name }}
                  path: src/vitest-report.json
