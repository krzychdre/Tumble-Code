name: Publish Extension

on:
  pull_request:
    types: [closed]
  workflow_dispatch:

env:
  GIT_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}

jobs:
  publish-extension:
    runs-on: ubuntu-latest
    # The Azure managed identity trusts only jobs in this environment.
    environment: marketplace
    permissions:
      contents: write # Required for pushing tags.
      id-token: write # Required for the Microsoft Entra ID login (OIDC).
    env:
      HAS_OVSX_PAT: ${{ secrets.OVSX_PAT != '' }}
    if: >
        ( github.event_name == 'pull_request' &&
        github.event.pull_request.base.ref == 'main' &&
        contains(github.event.pull_request.title, 'Changeset version bump') ) ||
        github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.GIT_REF }}
      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Package Extension
        run: |
          current_package_version=$(node -p "require('./src/package.json').version")
          pnpm vsix

          # Save VSIX contents to a temporary file to avoid broken pipe issues.
          unzip -l bin/tumble-code-${current_package_version}.vsix > /tmp/tumble-code-vsix-contents.txt

          # Check for required files.
          grep -q "extension/package.json" /tmp/tumble-code-vsix-contents.txt || exit 1
          grep -q "extension/package.nls.json" /tmp/tumble-code-vsix-contents.txt || exit 1
          grep -q "extension/dist/extension.js" /tmp/tumble-code-vsix-contents.txt || exit 1
          grep -q "extension/webview-ui/audio/celebration.wav" /tmp/tumble-code-vsix-contents.txt || exit 1
          grep -q "extension/webview-ui/build/assets/index.js" /tmp/tumble-code-vsix-contents.txt || exit 1
          grep -q "extension/assets/codicons/codicon.ttf" /tmp/tumble-code-vsix-contents.txt || exit 1
          grep -q "extension/assets/vscode-material-icons/icons/3d.svg" /tmp/tumble-code-vsix-contents.txt || exit 1
          # A local src/.env may hold API keys: it must never ship.
          if grep -qE '/\.env$' /tmp/tumble-code-vsix-contents.txt; then echo "VSIX contains a .env file"; exit 1; fi
          
          # Clean up temporary file.
          rm /tmp/tumble-code-vsix-contents.txt
      - name: Create and Push Git Tag
        run: |
          current_package_version=$(node -p "require('./src/package.json').version")
          git tag -a "v${current_package_version}" -m "Release v${current_package_version}"
          git push origin "v${current_package_version}" --no-verify
          echo "Successfully created and pushed git tag v${current_package_version}"
      # VS Code Marketplace: no stored token. The managed identity in the
      # AZURE_* repository variables is a Contributor of the QUB-IT publisher.
      - name: Azure login
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Publish to VS Code Marketplace
        run: pnpm --filter tumble-code publish:marketplace
      # Open VSX has its own token; skip the step until OVSX_PAT is set.
      - name: Publish to Open VSX
        if: env.HAS_OVSX_PAT == 'true'
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: pnpm --filter tumble-code publish:openvsx
      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          current_package_version=$(node -p "require('./src/package.json').version")

          # Extract changelog for current version
          echo "Extracting changelog for version ${current_package_version}"
          changelog_content=$(sed -n "/## \\[${current_package_version}\\]/,/## \\[/p" CHANGELOG.md | sed '$d')

          # If changelog extraction failed, use a default message
          if [ -z "$changelog_content" ]; then
            echo "Warning: No changelog section found for version ${current_package_version}"
            changelog_content="Release v${current_package_version}"
          else
            echo "Found changelog section for version ${current_package_version}"
          fi

          # Create release with changelog content
          gh release create "v${current_package_version}" \
            --title "Release v${current_package_version}" \
            --notes "$changelog_content" \
            --target ${{ env.GIT_REF }} \
            bin/tumble-code-${current_package_version}.vsix
          echo "Successfully created GitHub Release v${current_package_version}"
