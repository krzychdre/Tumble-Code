name: Publish Release

on:
  pull_request:
    types: [closed]
  workflow_dispatch:

env:
  GIT_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}

# One release ships the extension and the CLI under one version: the CLI
# tarballs are built first, so a failed CLI build stops the release before
# the tag, the Marketplace and the GitHub release.
jobs:
  build-cli:
    if: >
        ( github.event_name == 'pull_request' &&
        github.event.pull_request.merged == true &&
        github.event.pull_request.base.ref == 'main' &&
        contains(github.event.pull_request.title, 'Changeset version bump') ) ||
        github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        include:
          - platform: darwin-arm64
            runs-on: macos-latest
          - platform: linux-x64
            runs-on: ubuntu-latest
          - platform: linux-arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.GIT_REF }}
      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm
      # Builds bin/tumble-cli-<platform>.tar.gz and installs it once as a check.
      - name: Build CLI tarball
        run: ./apps/cli/scripts/build.sh --release
      - name: Checksum
        working-directory: bin
        run: shasum -a 256 "tumble-cli-${{ matrix.platform }}.tar.gz" > "tumble-cli-${{ matrix.platform }}.tar.gz.sha256"
      - name: Upload CLI tarball
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-${{ matrix.platform }}
          path: |
            bin/tumble-cli-${{ matrix.platform }}.tar.gz
            bin/tumble-cli-${{ matrix.platform }}.tar.gz.sha256
          retention-days: 7

  publish-extension:
    needs: build-cli
    runs-on: ubuntu-latest
    # The Azure managed identity trusts only jobs in this environment.
    environment: marketplace
    permissions:
      contents: write # Required for pushing tags.
      id-token: write # Required for the Microsoft Entra ID login (OIDC).
    env:
      HAS_OVSX_PAT: ${{ secrets.OVSX_PAT != '' }}
    if: >
        ( github.event_name == 'pull_request' &&
        github.event.pull_request.merged == true &&
        github.event.pull_request.base.ref == 'main' &&
        contains(github.event.pull_request.title, 'Changeset version bump') ) ||
        github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.GIT_REF }}
      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Package Extension
        run: |
          current_package_version=$(node -p "require('./src/package.json').version")
          pnpm vsix

          # Save VSIX contents to a temporary file to avoid broken pipe issues.
          unzip -l bin/tumble-code-${current_package_version}.vsix > /tmp/tumble-code-vsix-contents.txt

          # Check for required files.
          grep -q "extension/package.json" /tmp/tumble-code-vsix-contents.txt || exit 1
          grep -q "extension/package.nls.json" /tmp/tumble-code-vsix-contents.txt || exit 1
          grep -q "extension/dist/extension.js" /tmp/tumble-code-vsix-contents.txt || exit 1
          grep -q "extension/webview-ui/audio/celebration.wav" /tmp/tumble-code-vsix-contents.txt || exit 1
          grep -q "extension/webview-ui/build/assets/index.js" /tmp/tumble-code-vsix-contents.txt || exit 1
          grep -q "extension/assets/codicons/codicon.ttf" /tmp/tumble-code-vsix-contents.txt || exit 1
          grep -q "extension/assets/vscode-material-icons/icons/3d.svg" /tmp/tumble-code-vsix-contents.txt || exit 1
          # A local src/.env may hold API keys: it must never ship.
          if grep -qE '/\.env$' /tmp/tumble-code-vsix-contents.txt; then echo "VSIX contains a .env file"; exit 1; fi
          
          # Clean up temporary file.
          rm /tmp/tumble-code-vsix-contents.txt
      - name: Download CLI tarballs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cli-*
          path: bin/cli
          merge-multiple: true
      - name: Create and Push Git Tag
        run: |
          current_package_version=$(node -p "require('./src/package.json').version")
          git tag -a "v${current_package_version}" -m "Release v${current_package_version}"
          git push origin "v${current_package_version}" --no-verify
          echo "Successfully created and pushed git tag v${current_package_version}"
      # VS Code Marketplace: no stored token. The managed identity in the
      # AZURE_* repository variables is a Contributor of the QUB-IT publisher.
      - name: Azure login
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Publish to VS Code Marketplace
        run: pnpm --filter tumble-code publish:marketplace
      # Open VSX has its own token; skip the step until OVSX_PAT is set.
      - name: Publish to Open VSX
        if: env.HAS_OVSX_PAT == 'true'
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: pnpm --filter tumble-code publish:openvsx
      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          current_package_version=$(node -p "require('./src/package.json').version")

          # The section of this version, headed "## 1.2.3 (2026-11-02)" (scripts/format-changelog.mjs) or "## [1.2.3]".
          awk -v v="$current_package_version" \
            '$1 == "##" && ($2 == v || $2 == "[" v "]") { on = 1; next } on && /^## / { exit } on' \
            CHANGELOG.md > /tmp/release-notes.md
          if [ ! -s /tmp/release-notes.md ]; then
            echo "Release v${current_package_version}" > /tmp/release-notes.md
          fi

          # GitHub rejects release notes over 125000 characters: cut at a line boundary
          # and link the full changelog.
          if [ "$(wc -c < /tmp/release-notes.md)" -gt 120000 ]; then
            head -c 120000 /tmp/release-notes.md | sed '$d' > /tmp/release-notes.cut.md
            printf '\n...\n\nFull changelog: https://github.com/%s/blob/v%s/CHANGELOG.md\n' \
              "$GITHUB_REPOSITORY" "$current_package_version" >> /tmp/release-notes.cut.md
            mv /tmp/release-notes.cut.md /tmp/release-notes.md
          fi

          cat >> /tmp/release-notes.md <<'EOF'

          ## Install

          The extension: [Visual Studio Marketplace](https://marketplace.visualstudio.com/items?itemName=QUB-IT.tumble-code), or the `.vsix` below.

          The CLI (macOS on Apple silicon, Linux x64 and arm64; Node.js 22 or newer):

          ```sh
          curl -fsSL https://raw.githubusercontent.com/krzychdre/tumble-code/main/apps/cli/install.sh | sh
          ```

          Its settings live in `~/.roo/cli-settings.json`; the [example settings file](https://github.com/krzychdre/tumble-code/blob/main/apps/cli/examples/cli-settings.example.json) sets every option.
          EOF

          gh release create "v${current_package_version}" \
            --title "Release v${current_package_version}" \
            --notes-file /tmp/release-notes.md \
            --target ${{ env.GIT_REF }} \
            bin/tumble-code-${current_package_version}.vsix \
            bin/cli/*
          echo "Successfully created GitHub Release v${current_package_version}"
