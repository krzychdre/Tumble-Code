name: Dependency audit

# Lists known advisories in the dependencies that ship (pnpm audit --prod).
# Runs when dependencies change and once a week, because new advisories are
# published without any change in this repository.
#
# Blocking: a high or critical advisory fails the run unless it is accepted,
# with a reason and an expiry date, in scripts/audit-allowlist.mjs, and so
# does a package without a valid registry signature.

on:
    workflow_dispatch:
    schedule:
        - cron: "0 6 * * 1" # Mondays, 06:00 UTC
    push:
        branches: [main]
        paths:
            - "pnpm-lock.yaml"
            - "**/package.json"
            - ".github/workflows/dependency-audit.yml"
            - "scripts/audit-*.mjs"
    pull_request:
        types: [opened, reopened, ready_for_review, synchronize]
        branches: [main]
        paths:
            - "pnpm-lock.yaml"
            - "**/package.json"
            - ".github/workflows/dependency-audit.yml"
            - "scripts/audit-*.mjs"

jobs:
    pnpm-audit:
        name: pnpm-audit
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            # pnpm audit reads the lockfile only, so nothing needs installing.
            - name: Setup Node.js and pnpm
              uses: ./.github/actions/setup-node-pnpm
              with:
                  skip-install: "true"
            # pnpm audit exits non-zero whenever it finds anything; the gate step decides.
            - name: Audit the shipped dependencies
              run: pnpm audit --prod --json > "$RUNNER_TEMP/audit.json" || true
            - name: Summarize advisories
              run: node scripts/audit-summary.mjs < "$RUNNER_TEMP/audit.json" >> "$GITHUB_STEP_SUMMARY"
            - name: Fail on unaccepted high or critical advisories
              run: node scripts/audit-gate.mjs < "$RUNNER_TEMP/audit.json"
            # Every package in the lockfile, dev tools included, must carry a valid registry signature.
            - name: Verify registry signatures
              run: pnpm audit signatures
