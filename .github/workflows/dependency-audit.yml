name: Dependency audit

# Lists known advisories in the dependencies that ship (pnpm audit --prod).
# Runs when dependencies change and once a week, because new advisories are
# published without any change in this repository.
#
# Blocking: a high or critical advisory fails the run unless it is accepted,
# with a reason and an expiry date, in scripts/audit-allowlist.mjs.

on:
    workflow_dispatch:
    schedule:
        - cron: "0 6 * * 1" # Mondays, 06:00 UTC
    push:
        branches: [main]
        paths:
            - "pnpm-lock.yaml"
            - "**/package.json"
            - ".github/workflows/dependency-audit.yml"
            - "scripts/audit-*.mjs"
    pull_request:
        types: [opened, reopened, ready_for_review, synchronize]
        branches: [main]
        paths:
            - "pnpm-lock.yaml"
            - "**/package.json"
            - ".github/workflows/dependency-audit.yml"
            - "scripts/audit-*.mjs"

jobs:
    pnpm-audit:
        name: pnpm-audit
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
            # pnpm audit reads the lockfile only, so nothing needs installing.
            - name: Setup Node.js and pnpm
              uses: ./.github/actions/setup-node-pnpm
              with:
                  skip-install: "true"
            # pnpm audit exits non-zero whenever it finds anything, and the default
            # shell runs with pipefail; this step only reports, the next one decides.
            - name: Summarize advisories
              run: |
                  { pnpm audit --prod --json || true; } | node scripts/audit-summary.mjs >> "$GITHUB_STEP_SUMMARY"
            - name: Fail on unaccepted high or critical advisories
              run: |
                  { pnpm audit --prod --json || true; } | node scripts/audit-gate.mjs
