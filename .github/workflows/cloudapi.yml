name: Cloud API (Python)

# The self-hosted cloud API is a separate Python service, so the Node-based
# Code QA workflow never ran its tests. This one runs when the service (or
# this file) changes, and weekly so that an advisory published against an
# unchanged uv.lock still fails the blocking pip-audit step.

on:
    workflow_dispatch:
    schedule:
        # Mondays 06:17 UTC (off the hour, when GitHub's scheduler is busiest).
        - cron: "17 6 * * 1"
    push:
        branches: [main]
        paths:
            - "self-hosted-cloudapi/**"
            - ".github/workflows/cloudapi.yml"
    pull_request:
        types: [opened, reopened, ready_for_review, synchronize]
        branches: [main]
        paths:
            - "self-hosted-cloudapi/**"
            - ".github/workflows/cloudapi.yml"

defaults:
    run:
        working-directory: self-hosted-cloudapi

jobs:
    test:
        name: cloudapi-test (python ${{ matrix.python }})
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                # 3.13 is what the Docker image and local development run; 3.12 is
                # the floor pyproject.toml still declares (requires-python).
                python: ["3.12", "3.13"]
        # A real Postgres for tests/test_recall_pg.py (full-text search, its
        # index and the statement timeout cannot be checked on SQLite). The
        # same version as docker-compose.yml.
        services:
            postgres:
                image: postgres:16.15-alpine
                env:
                    POSTGRES_PASSWORD: test
                    POSTGRES_DB: recall
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 12
        env:
            RECALL_PG_URL: postgresql+asyncpg://postgres:test@localhost:5432/recall
        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Setup uv and Python
              uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
              with:
                  python-version: ${{ matrix.python }}
                  enable-cache: true
                  cache-dependency-glob: self-hosted-cloudapi/uv.lock
            - name: Install dependencies
              run: uv sync --frozen --extra dev
            # The browser checks drive headless Chrome, which ubuntu-latest ships;
            # they skip themselves when no Chrome binary is found.
            - name: Run tests
              run: uv run pytest

    lint-and-audit:
        name: cloudapi-lint-and-audit
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Setup uv
              uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
              with:
                  python-version: "3.12"
            # Blocking since CAPI-M7 cleaned up the last findings. Fix new ones by
            # hand, not with a blind --fix: E712 wants `not Column`, which is wrong
            # for a SQLAlchemy comparison (write `.is_(False)`), and an import that
            # only registers models needs `# noqa: F401`.
            - name: Lint with ruff
              run: make lint
            # Blocking: the floors raised in DEP-5 left the lock with no known
            # advisory, so a new one should fail the run.
            - name: Audit locked dependencies
              run: |
                  uv export --frozen --no-hashes --no-emit-project > "$RUNNER_TEMP/requirements.txt"
                  uvx pip-audit@2.10.1 -r "$RUNNER_TEMP/requirements.txt" --no-deps --disable-pip
