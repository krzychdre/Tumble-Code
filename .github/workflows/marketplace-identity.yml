# One-off: proves the publishing identity may publish for QUB-IT (no publish happens).
# Delete this file once it is green.
name: Marketplace identity id

on:
  workflow_dispatch:

jobs:
  identity-id:
    runs-on: ubuntu-latest
    environment: marketplace
    permissions:
      id-token: write
    steps:
      - name: Azure login
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Verify publish rights for QUB-IT
        run: npx --yes @vscode/vsce@4.0.0 verify-pat --azure-credential QUB-IT
