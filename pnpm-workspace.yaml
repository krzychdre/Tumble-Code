packages:
    - "src" # Should be apps/vscode
    - "webview-ui" # Should be apps/vscode-webview
    - "apps/*"
    - "packages/*"

# Build scripts nothing here needs; pnpm 10 skipped them too.
allowBuilds:
    "@google/genai": false
    "@vscode/vsce-sign": false
    esbuild: false
    protobufjs: false

# Locked before pnpm 12 enforced its one-day minimumReleaseAge default; drop each
# entry once it is a day old (all are by 2026-10-24T14:27Z).
minimumReleaseAgeExclude:
    - "@anthropic-ai/sdk@1.2.0"
    - "@anthropic-ai/vertex-sdk@1.1.0"
    - "@asamuzakjp/dom-selector@10.0.5"
    - "@google/genai@2.31.0"
    - execa@10.2.1
    - i18next@26.5.6
    - openai@7.43.0
    - react-i18next@17.1.4

overrides:
    tar-fs: ">=3.1.1"
    esbuild: "^0.28.2"
    esbuild-wasm: "^0.28.2"
    undici: "^7.29.0"
    jsdom>undici: "^8.10.2"
    rehype-katex>katex: "^0.19.0"
    bluebird: ">=3.7.2"
    "@lmstudio/sdk>zod": "3.25.76"
    lodash-es: "^4.18.1"

catalog:
    "@modelcontextprotocol/sdk": "1.32.1"
    "@types/node": "^22.20.5"
    "@types/react": "^19.3.0"
    # src/package.json spells this range out: vsce package checks it against engines.vscode
    # and cannot parse "catalog:".
    "@types/vscode": "^1.102.0"
    "@vscode/vsce": "4.0.0"
    axios: "^1.20.0"
    diff: "^9.0.0"
    esbuild: "^0.28.2"
    eslint: "^10.13.0"
    execa: "^10.2.1"
    fast-deep-equal: "^3.1.3"
    fzf: "^0.5.2"
    globals: "^17.13.0"
    i18next: "^26.5.6"
    ignore: "^7.0.13"
    mkdirp: "^3.0.1"
    openai: "^7.43.0"
    p-wait-for: "^7.0.0"
    pretty-bytes: "^7.2.0"
    proper-lockfile: "^4.1.2"
    react: "19.3.1"
    rimraf: "^6.1.3"
    tsup: "^9.0.0"
    tsx: "^4.23.15"
    vitest: "^5.0.5"
    vscode-material-icons: "^0.1.1"
    zod: "4.6.7"
