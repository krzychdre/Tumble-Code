{% extends "base.html" %}
{% block title %}Not found · Tumble Code{% endblock %}
{% block content %}
<div class="empty">
  <h1 class="page-title">{{ heading or "Task not found" }}</h1>
  <p class="empty-hint">{{ hint or "This task does not exist, or you don't have access to it." }}</p>
  <p class="empty-actions"><a class="btn" href="{{ back_href or '/app' }}">{{ back_label or "Back to your tasks" }}</a></p>
</div>
{% endblock %}
