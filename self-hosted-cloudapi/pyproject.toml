[project]
name = "roo-cloud-api"
version = "0.1.0"
description = "Self-hosted Roo Code Cloud API"
authors = [{name = "Roo Code Community"}]
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.14.2",
    "python-jose[cryptography]>=3.3.0",
    "httpx>=0.28.0",
    "itsdangerous>=2.2.0",
    "slowapi>=0.1.9",
    "python-multipart>=0.0.31",
    "pyyaml>=6.0.2",
    "starlette>=1.3.1",
    "jinja2>=3.1.4",
    "python-socketio>=5.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "aiosqlite>=0.20.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
# Floors for transitive dependencies with known advisories below them (DEP-5).
# Constraints, not dependencies: they bound what `uv lock` may pick without
# making these packages direct requirements of the service.
constraint-dependencies = [
    "anyio>=4.14.2",
    "cryptography>=50.0.1",
    "idna>=3.15",
    "pyasn1>=0.6.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
