# Full self-hosted stack: cloud API + its Postgres, plus a bundled Authentik
# (server, worker, Postgres; Authentik has not used Redis since 2025.10).
# `docker compose up -d` brings up everything
# and the Authentik OAuth2 provider/application is auto-provisioned from the
# blueprint in ./authentik/blueprints, so no manual Authentik clicking is needed.
#
# Reference for the Authentik services: /opt/docker/llm/docker-compose.yaml
services:
  # --- Cloud API ------------------------------------------------------------
  api:
    build: .
    ports:
      - "${PORT:-8085}:${PORT:-8085}"
    # config/settings.py is the one place that holds the api's defaults. A
    # bare name below passes the variable through from the shell or .env when
    # it is set and leaves it out of the container when it is not, so the
    # settings.py default applies. A `${VAR:-}` form would not do: it hands
    # the app an empty string, which pydantic-settings does not treat as
    # missing (BRIDGE_ENABLED="" or PORT="" fail validation at startup).
    # Values are given here only where the compose stack itself decides them
    # (its own Postgres, the in-network Authentik address) or where settings.py
    # has no default and the bundled stack has an obvious one.
    environment:
      DATABASE_URL: postgresql://roo:password@postgres:5432/roo_cloud
      # Required secrets: there is no safe default, so `docker compose up`
      # stops with this message instead of starting an api that refuses them.
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env (see .env.example)}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (see .env.example)}
      API_BASE_URL: ${API_BASE_URL:-http://localhost:8085}
      # Browser-facing Authentik URL (front-channel: authorize / logout redirects).
      AUTHENTIK_BASE_URL: ${AUTHENTIK_BASE_URL:-http://localhost:9000}
      # In-network Authentik URL (back-channel: token / userinfo / jwks / discovery).
      # The api container's own localhost is not Authentik, so it must reach the
      # auth_server service by name.
      AUTHENTIK_INTERNAL_URL: ${AUTHENTIK_INTERNAL_URL:-http://auth_server:9000}
      # Same credentials the blueprint provisions into Authentik (the
      # auth_server environment below uses the same fallbacks).
      AUTHENTIK_CLIENT_ID: ${AUTHENTIK_CLIENT_ID:-tumble-code}
      AUTHENTIK_REDIRECT_URI: ${AUTHENTIK_REDIRECT_URI:-http://localhost:8085/auth/clerk/callback}
      # Passed through only when set; settings.py holds the defaults.
      PORT:
      LOG_LEVEL:
      JWT_ALGORITHM:
      CLIENT_TOKEN_IDLE_DAYS:
      AUTHENTIK_CLIENT_SECRET:
      CORS_ORIGINS:
      WEB_ALLOWED_NETWORKS:
      WEB_PUBLIC_URL:
      BRIDGE_ENABLED:
      BRIDGE_PATH:
      TELEMETRY_ENABLED:
      BACKFILL_MAX_BYTES:
      ENABLE_TASK_SHARING:
      ALLOW_PUBLIC_TASK_SHARING:
      RATE_LIMIT_ENABLED:
      RATE_LIMIT_REQUESTS_PER_MINUTE:
      RETENTION_SWEEP_ENABLED:
      RETENTION_SWEEP_HOURS:
    healthcheck:
      # Readiness, not liveness: /health would report ok even with a dead
      # database. The slim image has no curl/wget; python ships with the
      # base image. /health/ready answers 503 when SELECT 1 fails.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:' + __import__('os').environ.get('PORT', '8085') + '/health/ready', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      auth_server:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    # Minor pinned, so an update is a reviewed change instead of whatever the
    # tag points at on the next pull. Stay on 16.x: a major upgrade needs a
    # dump and restore (or pg_upgrade) of the data directory, not a tag change.
    image: postgres:16.15-alpine
    # Not published to the host: nothing outside the compose network needs it,
    # and 5432 collides with other local Postgres instances. Reachable in-network
    # as postgres:5432.
    environment:
      POSTGRES_USER: roo
      POSTGRES_PASSWORD: password
      POSTGRES_DB: roo_cloud
    volumes:
      - ./.vol/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roo"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # --- Authentik ------------------------------------------------------------
  auth_db:
    image: docker.io/library/postgres:16.15-alpine
    environment:
      POSTGRES_DB: ${PG_DB:-authentik}
      POSTGRES_USER: ${PG_USER:-authentik}
      POSTGRES_PASSWORD: ${AUTH_PG_PASS:?database password required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    ports:
      # Host port remapped 5432 -> 5544 to avoid colliding with other local
      # Postgres instances. Internal port stays 5432 (auth_server/worker reach it
      # as auth_db:5432). Override AUTH_DB_PORT to coexist with another stack.
      - "${AUTH_DB_PORT:-5544}:5432"
    volumes:
      - ./.vol/auth/postgres:/var/lib/postgresql/data
    restart: unless-stopped

  auth_server:
    # Tag and digest pinned together (the digest is the multi-arch index from
    # `docker buildx imagetools inspect ghcr.io/goauthentik/server:2026.8.3`).
    # AUTHENTIK_TAG may override both, with or without a digest suffix.
    #
    # Authentik migrates its database on start, one way, and refuses to skip a
    # release line: an existing install must step through the latest patch of
    # every line in between (2026.2.x -> 2026.5.x -> 2026.8.x), with a pg_dump
    # of auth_db first. See the upgrade section of README.md.
    image: ${AUTHENTIK_IMAGE:-ghcr.io/goauthentik/server}:${AUTHENTIK_TAG:-2026.8.3@sha256:ab9b4e8cc4ab3f8d1198d2db6aeea66bafea1963b3f2843589e0d163f97d9849}
    command: server
    environment: &authentik_env
      AUTHENTIK_POSTGRESQL__HOST: auth_db
      AUTHENTIK_POSTGRESQL__NAME: ${PG_DB:-authentik}
      AUTHENTIK_POSTGRESQL__USER: ${PG_USER:-authentik}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTH_PG_PASS}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?secret key required}
      # First-run admin (akadmin). Lets you log in to the Authentik UI and is the
      # account you sign in with during the extension OAuth flow.
      AUTHENTIK_BOOTSTRAP_PASSWORD: ${AUTHENTIK_BOOTSTRAP_PASSWORD:-}
      AUTHENTIK_BOOTSTRAP_EMAIL: ${AUTHENTIK_BOOTSTRAP_EMAIL:-admin@example.com}
      AUTHENTIK_BOOTSTRAP_TOKEN: ${AUTHENTIK_BOOTSTRAP_TOKEN:-}
      # Consumed by the blueprint's !Env tags to provision the OAuth2 provider.
      AUTHENTIK_CLIENT_ID: ${AUTHENTIK_CLIENT_ID:-tumble-code}
      AUTHENTIK_CLIENT_SECRET: ${AUTHENTIK_CLIENT_SECRET:-}
      AUTHENTIK_REDIRECT_URI: ${AUTHENTIK_REDIRECT_URI:-http://localhost:8085/auth/clerk/callback}
      # When set, the blueprint registers <WEB_PUBLIC_URL>/auth/clerk/callback as
      # a second redirect URI, so a browser on another machine can sign in.
      WEB_PUBLIC_URL: ${WEB_PUBLIC_URL:-}
    healthcheck:
      test: ["CMD", "ak", "healthcheck"]
      start_period: 60s
      interval: 30s
      timeout: 30s
      retries: 8
    ports:
      - "${COMPOSE_PORT_HTTP:-9000}:9000"
      - "${COMPOSE_PORT_HTTPS:-9443}:9443"
    shm_size: 512mb
    volumes:
      - ./.vol/auth/data:/data
      - ./.vol/auth/templates:/templates
      - ./authentik/blueprints:/blueprints/custom:ro
    depends_on:
      auth_db:
        condition: service_healthy
    restart: unless-stopped

  auth_worker:
    # Must run the same image as auth_server.
    image: ${AUTHENTIK_IMAGE:-ghcr.io/goauthentik/server}:${AUTHENTIK_TAG:-2026.8.3@sha256:ab9b4e8cc4ab3f8d1198d2db6aeea66bafea1963b3f2843589e0d163f97d9849}
    command: worker
    # The worker is what applies blueprints, so it needs the same env (incl. the
    # AUTHENTIK_CLIENT_* values the blueprint reads via !Env).
    environment: *authentik_env
    user: root
    shm_size: 512mb
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./.vol/auth/data:/data
      - ./.vol/auth/certs:/certs
      - ./.vol/auth/templates:/templates
      - ./authentik/blueprints:/blueprints/custom:ro
    depends_on:
      auth_db:
        condition: service_healthy
    restart: unless-stopped

# Pin the network subnet. Docker's 172.17.0.0/12 pool is exhausted on this
# host (15 networks already), so the daemon falls back to its spare pool
# 192.168.0.0/16 in /20 chunks. The auto-assigned 192.168.0.0/20 claimed the
# whole 192.168.0.0-15.255 range, which swallowed 192.168.8.1 — the admin
# page of the router behind the home gateway became unreachable
# ("Brak trasy do hosta"). 10.99.0.0/24 is private and unused here (no 10.x
# routes or interfaces on the laptop), and one /24 is enough for 5 services.
networks:
  default:
    ipam:
      driver: default
      config:
        - subnet: 10.99.0.0/24
