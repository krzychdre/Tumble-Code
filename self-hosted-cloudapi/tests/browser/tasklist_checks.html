<!DOCTYPE html><html><head><meta charset="utf-8"></head><body>
<!--
  Selection behaviour for the task list (static/tasklist.js), driven against a
  DOM that mirrors templates/tasks_list.html. Kept as a fixture rather than a
  copy of the template so the assertions are about behaviour, not markup.
-->
<form id="bulk-form" method="post" action="/app/tasks/bulk-delete">
  <input type="hidden" name="scope" value="roots">
  <input type="hidden" name="q" value="">
  <div class="select-head">
    <label class="select-all"><input type="checkbox" id="select-all"><span>Select page</span></label>
  </div>
  <ul class="task-list">
    <li class="task-node" data-task-id="t1" data-state="done" data-rest="done"><div class="task-item">
      <label class="task-check"><input type="checkbox" name="task_ids" value="t1" data-child-count="0"></label>
      <a class="task-link" href="/app/tasks/t1"><span class="cell-title">One</span></a>
      <div class="task-delete">
        <button class="btn-delete" type="submit" formaction="/app/tasks/t1/delete" title="Delete task"
                data-title="One" data-messages="1" data-subtasks="0">Delete</button>
      </div>
    </div></li>
    <li class="task-node" data-task-id="t2" data-state="done" data-rest="done"><div class="task-item">
      <label class="task-check"><input type="checkbox" name="task_ids" value="t2" data-child-count="2"></label>
      <a class="task-link" href="/app/tasks/t2"><span class="cell-title">Two</span></a>
      <div class="task-delete">
        <button class="btn-delete" type="submit" formaction="/app/tasks/t2/delete" title="Delete task"
                data-title="Two" data-messages="1" data-subtasks="2">Delete</button>
      </div>
    </div></li>
    <li class="task-node" data-task-id="t3" data-state="done" data-rest="done"><div class="task-item">
      <label class="task-check"><input type="checkbox" name="task_ids" value="t3" data-child-count="0"></label>
      <a class="task-link" href="/app/tasks/t3"><span class="cell-title">Three</span></a>
      <div class="task-delete">
        <button class="btn-delete" type="submit" formaction="/app/tasks/t3/delete" title="Delete task"
                data-title="Three" data-messages="4" data-subtasks="0">Delete</button>
      </div>
    </div></li>
    <li class="task-node" data-task-id="t4" data-state="done" data-rest="done"><div class="task-item">
      <label class="task-check"><input type="checkbox" name="task_ids" value="t4" data-child-count="0"></label>
      <a class="task-link" href="/app/tasks/t4"><span class="cell-title">Four</span></a>
      <div class="task-delete">
        <button class="btn-delete" type="submit" formaction="/app/tasks/t4/delete" title="Delete task"
                data-title="Four" data-messages="1" data-subtasks="0">Delete</button>
      </div>
    </div></li>
  </ul>
  <div id="bulk-bar" class="bulk-bar" hidden>
    <span class="bulk-count"><b id="bulk-n">0</b> selected</span>
    <label class="bulk-subtasks" id="bulk-subtasks-wrap" hidden>
      <input type="checkbox" name="include_subtasks" value="1" id="include-subtasks">
      <span>Include their subtasks (<b id="bulk-children">0</b>)</span>
    </label>
    <button type="button" class="btn ghost" id="bulk-clear">Clear</button>
    <button type="submit" class="btn btn-danger" id="bulk-delete">Delete selected</button>
  </div>
</form>

<section id="attention" class="attention" hidden></section>
<dialog id="delete-dialog" class="confirm">
  <form method="post" id="delete-dialog-form">
    <p id="delete-dialog-what"></p>
    <b id="delete-dialog-messages"></b>
    <label id="delete-dialog-subtasks-wrap">
      <input type="checkbox" name="include_subtasks" value="1" checked>
      <b id="delete-dialog-subtasks"></b>
    </label>
    <button type="button" id="delete-dialog-cancel">Cancel</button>
    <button type="submit" id="delete-dialog-ok">Delete</button>
  </form>
</dialog>
<script id="list-live-config" type="application/json">{"bridgePath": "/bridge/socket.io"}</script>
<script>
  // The bridge and the server, stood in for: tasklist.js is what is tested.
  var socketHandlers = {}
  var socketOptions = null
  window.io = function (url, options) {
    socketOptions = options
    return { on: function (name, fn) { socketHandlers[name] = fn } }
  }
  var fetched = []
  var serverHtml = ""
  window.fetch = function (url) {
    fetched.push(url)
    var html = serverHtml
    return Promise.resolve({ ok: true, text: function () { return Promise.resolve(html) } })
  }
</script>
<script src="../../src/web/static/tasklist.js"></script>
<script>
window.addEventListener("load", function () {
  var out = [], fail = 0
  function check(name, cond) { out.push((cond ? "PASS " : "FAIL ") + name); if (!cond) fail++ }

  var form = document.getElementById("bulk-form")
  var bar = document.getElementById("bulk-bar")
  var boxes = Array.prototype.slice.call(form.querySelectorAll('input[name="task_ids"]'))
  var selectAll = document.getElementById("select-all")
  var subtasksWrap = document.getElementById("bulk-subtasks-wrap")
  var includeSubtasks = document.getElementById("include-subtasks")

  // Never submits for real: the harness has no server, and a navigation would
  // abandon the remaining assertions. Registered after tasklist.js, so a submit
  // it cancelled still arrives here — count only the ones it let through.
  var submits = 0
  form.addEventListener("submit", function (e) {
    if (!e.defaultPrevented) submits++
    e.preventDefault()
  })

  // Nothing selected → the bar stays out of the way.
  check("action bar hidden with no selection", bar.hidden === true)

  boxes[0].click()
  check("bar appears on first selection", bar.hidden === false)
  check("count shows 1", document.getElementById("bulk-n").textContent === "1")
  check("row marked as selected", boxes[0].closest(".task-item").classList.contains("selected"))

  // Shift-click selects the range, the way a file manager does.
  //
  // Dispatched WITHOUT pre-setting `checked`: each box sits inside a <label>,
  // whose activation behaviour toggles the control for us — exactly as a real
  // click does. Setting it first and then dispatching toggles it back off, and
  // would test a sequence no user can produce.
  boxes[3].dispatchEvent(new MouseEvent("click", { shiftKey: true, bubbles: true, cancelable: true }))
  check("shift-click selects the range", boxes.every(function (b) { return b.checked }))
  check("count shows 4", document.getElementById("bulk-n").textContent === "4")
  check("select-all reflects a full page", selectAll.checked === true && !selectAll.indeterminate)

  // The subtask offer only appears when the selection actually has subtasks.
  check("subtask option offered", subtasksWrap.hidden === false)
  check("subtask count is the sum of the rows", document.getElementById("bulk-children").textContent === "2")

  document.getElementById("bulk-clear").click()
  check("clear deselects everything", boxes.every(function (b) { return !b.checked }))
  check("bar hides again", bar.hidden === true)
  check("select-all cleared", selectAll.checked === false)

  selectAll.click()
  check("select-all selects the page", boxes.every(function (b) { return b.checked }))
  boxes[1].click()
  check("select-all goes indeterminate on a partial page", selectAll.indeterminate === true)

  // A ticked "include subtasks" must not survive the selection that justified it.
  boxes.forEach(function (b) { if (b.value !== "t2") b.click() })
  // only t2 unchecked now; tick the option, then drop t2 from the selection
  boxes[1].click()            // t2 back in
  includeSubtasks.checked = true
  includeSubtasks.dispatchEvent(new Event("change"))
  boxes[1].click()            // t2 out again → no subtasks in the selection
  check("stale subtask option is cleared when it no longer applies",
        includeSubtasks.checked === false && subtasksWrap.hidden === true)

  // Confirmations.
  var asked = []
  var answer = true
  window.confirm = function (msg) { asked.push(msg); return answer }

  boxes.forEach(function (b) { b.checked = false })
  boxes[0].checked = true
  boxes[0].dispatchEvent(new Event("click", { bubbles: true }))

  answer = false
  submits = 0
  document.getElementById("bulk-delete").click()
  check("declining the confirmation cancels the bulk delete", submits === 0)
  check("bulk confirmation states the count", /1 task/.test(asked[asked.length - 1] || ""))

  answer = true
  submits = 0
  document.getElementById("bulk-delete").click()
  check("accepting submits once", submits === 1)

  // A row's delete opens the dialog for that row instead of submitting the list.
  var dialog = document.getElementById("delete-dialog")
  var dialogForm = document.getElementById("delete-dialog-form")
  var wrap = document.getElementById("delete-dialog-subtasks-wrap")
  var include = wrap.querySelector("input")
  var dialogSubmits = []
  dialogForm.addEventListener("submit", function (e) {
    dialogSubmits.push([dialogForm.getAttribute("action"), new FormData(dialogForm).get("include_subtasks")])
    e.preventDefault()
  })
  function rowDelete(id) { return form.querySelector('.btn-delete[formaction="/app/tasks/' + id + '/delete"]') }

  asked = []
  submits = 0
  rowDelete("t3").click()
  check("row delete opens the dialog", dialog.open === true)
  check("row delete neither confirms nor submits the list", asked.length === 0 && submits === 0)
  check("dialog names the row", document.getElementById("delete-dialog-what").textContent === "Three")
  check("dialog counts its messages", document.getElementById("delete-dialog-messages").textContent === "4 messages")
  check("no subtasks: the option is hidden and unticked", wrap.hidden === true && include.checked === false)
  document.getElementById("delete-dialog-cancel").click()
  check("cancel closes the dialog", dialog.open === false)

  rowDelete("t2").click()
  check("subtasks: the option is offered, ticked", wrap.hidden === false && include.checked === true)
  check("the option names the subtree", document.getElementById("delete-dialog-subtasks").textContent === "2 subtasks")
  check("one message is singular", document.getElementById("delete-dialog-messages").textContent === "1 message")
  document.getElementById("delete-dialog-ok").click()
  check("the dialog posts to that row's endpoint with its subtasks",
        dialogSubmits.length === 1 && dialogSubmits[0][0] === "/app/tasks/t2/delete" && dialogSubmits[0][1] === "1")
  dialog.close()

  // The live strip: fetched again when the bridge says so, and the rows follow it.
  function tick() { return new Promise(function (r) { setTimeout(r, 0) }) }
  function node(id) { return form.querySelector('.task-node[data-task-id="' + id + '"]') }
  var STRIP = '<section id="attention" class="attention"><ul>' +
    '<li class="attention-card" data-task-id="t1" data-state="waiting"><span class="state-pill">Waiting for you</span></li>' +
    '</ul></section>'
  var EMPTY = '<section id="attention" class="attention" hidden></section>'

  check("the socket uses the bridge path", socketOptions && socketOptions.path === "/bridge/socket.io")
  socketHandlers.connect()
  check("the first connect fetches nothing (the page is fresh)", fetched.length === 0)

  serverHtml = STRIP
  socketHandlers["user:tasks_changed"]()
  tick().then(tick).then(function () {
    check("a change fetches the strip", fetched[0] === "/app/attention")
    var strip = document.getElementById("attention")
    check("the strip is replaced", strip.hidden === false && strip.querySelector(".attention-card") !== null)
    var t1 = node("t1")
    check("a live row takes the strip's state", t1.getAttribute("data-state") === "waiting")
    var pill = t1.querySelector(".cell-title > .state-pill")
    check("a live row gets the pill", pill !== null && pill.textContent === "Waiting for you")
    check("a live row cannot be deleted", rowDelete("t1").disabled === true &&
          t1.querySelector(".task-delete").title === "Stop the task before deleting it")
    check("other rows stay as they were", node("t2").getAttribute("data-state") === "done" && !rowDelete("t2").disabled)

    // A session that ended answers with the sign-in page: what is shown stays.
    serverHtml = "<html><body>Sign in</body></html>"
    socketHandlers["user:tasks_changed"]()
    return tick().then(tick)
  }).then(function () {
    check("an answer without the strip keeps it", document.querySelector("#attention .attention-card") !== null)

    serverHtml = EMPTY
    socketHandlers.connect()
    return tick().then(tick)
  }).then(function () {
    check("a reconnect fetches the strip again", fetched.length === 3)
    var t1 = node("t1")
    check("a row no longer live falls back to its own state", t1.getAttribute("data-state") === "done")
    check("its pill goes", t1.querySelector(".state-pill") === null)
    check("it can be deleted again", rowDelete("t1").disabled === false &&
          rowDelete("t1").title === "Delete task" && !t1.querySelector(".task-delete").hasAttribute("title"))
    check("the empty strip is hidden", document.getElementById("attention").hidden === true)
  }).catch(function (err) {
    check("live checks threw: " + err, false)
  }).then(function () {
    var pre = document.createElement("pre")
    pre.id = "results"
    pre.textContent = out.join("\n") + "\nTOTAL_FAILURES=" + fail
    document.body.appendChild(pre)
  })
})
</script>
</body></html>
