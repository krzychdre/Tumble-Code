<!DOCTYPE html><html><head><meta charset="utf-8"></head><body>
<!--
  The live header on a task page (static/live.js): what the join acknowledgement
  may and may not write into it. The bridge keeps ONE record per extension, not
  per task: whatever the extension registered with (no figures at all), merged
  with the last snapshot of whichever task it last reported on. Mirrors the
  markup templates/task_detail.html renders when the bridge is on; socket.io and
  the rendered conversation are stubbed, so each scenario loads live.js afresh
  against its own fake socket.
-->
<!-- The cockpit header: the state, Stop, and the Details summary. -->
<div id="detail-header" class="detail-header cockpit">
  <span id="task-state" class="state-pill" data-state="connecting">Connecting…</span>
  <button type="button" id="head-stop" hidden>Stop</button>
  <button type="button" id="details-toggle" aria-expanded="false" aria-controls="detail-more">Details
    <span id="sum-mode">&#8212;</span> <span id="sum-tokens">3.4M</span> <span id="sum-cost">$1.4090</span></button>
</div>
<section class="task-stats panel">
  <div class="live-line">
    <span id="live-status" class="live-status">Connecting…</span>
    <span id="live-activity" class="live-activity" hidden></span>
    <span class="live-stat">mode <b id="hdr-mode">&#8212;</b></span>
    <span class="live-stat">context <b id="hdr-context">&#8212;</b></span>
  </div>
  <!-- As rendered for a task with subtasks, from the stored figures. -->
  <table class="spend-table"><tbody>
    <tr class="spend-run"><th>whole run</th><td id="hdr-run-tokens">3.4M</td><td id="hdr-run-in">3.3M</td><td id="hdr-run-out">60.1k</td><td id="hdr-run-cost">$1.4090</td></tr>
    <tr class="spend-own"><th>this task</th><td id="hdr-own-tokens">303.7k</td><td id="hdr-own-in">297.8k</td><td id="hdr-own-out">5.9k</td><td id="hdr-own-cost">$0.1656</td></tr>
    <tr class="spend-subtasks"><th>2 subtasks</th><td id="hdr-subtasks-tokens">3.1M</td><td id="hdr-subtasks-in">3M</td><td id="hdr-subtasks-out">54.2k</td><td id="hdr-subtasks-cost">$1.2434</td></tr>
  </tbody></table>
</section>
<div id="live-controls" class="live-controls offline">
  <section id="ask-dock" hidden>
    <span id="ask-dock-kind"></span><a href="#" id="ask-dock-jump">show in conversation</a>
    <div id="ask-dock-question"></div>
    <div id="ask-dock-detail" hidden></div>
    <div id="ask-dock-suggestions" hidden></div>
    <p id="ask-dock-own" hidden></p>
    <div id="ask-dock-decide" hidden>
      <button type="button" id="ask-dock-approve">Approve</button>
      <button type="button" id="ask-dock-deny">Deny</button>
      <p id="ask-dock-comment"></p>
    </div>
  </section>
  <input id="auto-enabled" type="checkbox">
  <select id="auto-mode"><option value="default">default</option><option value="bypass">bypass</option></select>
  <input id="auto-ReadOnly" type="checkbox"><input id="auto-Write" type="checkbox">
  <input id="auto-Execute" type="checkbox"><input id="auto-Mcp" type="checkbox">
  <input id="auto-ModeSwitch" type="checkbox"><input id="auto-Subtasks" type="checkbox">
  <textarea id="chat-input" placeholder="Message the task…"></textarea>
  <button id="btn-send" type="button">Send</button>
  <button id="btn-stop" type="button" hidden>Stop</button>
  <button id="btn-resume" type="button">Resume</button>
  <button type="button" id="auto-more" aria-expanded="false" aria-controls="auto-bar">Auto-approve settings</button>
</div>
<script id="live-config" type="application/json">{"taskId": "task-a", "bridgePath": "/bridge/socket.io",
  "subtasks": {"tokensIn": 3000000, "tokensOut": 54200, "cost": 1.2434}}</script>
<!-- live.js formats with the page-wide helpers the template loads before it,
     and draws the dock's Markdown with render.js. -->
<script src="../../src/web/static/vendor/marked.min.js"></script>
<script src="../../src/web/static/vendor/purify.min.js"></script>
<script src="../../src/web/static/format.js"></script>
<script src="../../src/web/static/render.js"></script>
<script>
// What the saved conversation of task-a adds up to (render.js getMetrics).
window.__tumbleConversation = {
  getMetrics: function () {
    return { totalTokensIn: 297800, totalTokensOut: 5900, totalCost: 0.1656, contextTokens: 32200 }
  },
  getActivity: function () { return null },
  upsert: function () {},
  // What live.js asked of the conversation, newest last.
  calls: [],
  setActiveAsk: function (ts) { this.calls.push(["setActiveAsk", ts]) },
  clearActiveAsk: function () { this.calls.push(["clearActiveAsk"]) },
  markResolved: function (ts, decision, answer) { this.calls.push(["markResolved", ts, decision, answer]) },
  revealRow: function (ts) { this.calls.push(["revealRow", ts]) },
}
// static/follow.js: live.js asks it to open a live task at its tail.
window.TumbleFollow = { calls: 0, toTail: function () { this.calls++ } }

// One fake socket per load of live.js. `join` is what the server acknowledges
// task:join with; `fire` delivers a server event to the handlers live.js set.
var sockets = []
window.io = function () {
  var handlers = {}
  var sock = {
    join: null,
    emitted: [],
    on: function (evt, fn) { handlers[evt] = fn },
    emit: function (evt, payload, ack) {
      sock.emitted.push({ evt: evt, payload: payload })
      if (evt === "task:join" && ack) ack(sock.join)
    },
    fire: function (evt, data) { if (handlers[evt]) handlers[evt](data) },
  }
  sockets.push(sock)
  return sock
}
</script>
<script>
window.addEventListener("load", function () {
  var out = [], fail = 0
  function check(name, cond) { out.push((cond ? "PASS " : "FAIL ") + name); if (!cond) fail++ }
  function text(id) { return document.getElementById(id).textContent }
  function reset() {
    ;["hdr-mode", "hdr-context"].concat(
      ["run", "own"].reduce(function (ids, row) {
        return ids.concat(["tokens", "in", "out", "cost"].map(function (col) { return "hdr-" + row + "-" + col }))
      }, [])
    ).forEach(function (id) {
      document.getElementById(id).textContent = "\u2014"
    })
    document.querySelectorAll("#live-controls input[type=checkbox]").forEach(function (b) { b.checked = false })
    window.TumbleFollow.calls = 0
  }

  // Loads live.js against a fresh socket, joins with `joinAck`, then hands the
  // socket to `then`. Scenarios run one after another.
  function scenario(joinAck, then, next) {
    reset()
    var s = document.createElement("script")
    s.src = "../../src/web/static/live.js?n=" + sockets.length
    s.onload = function () {
      var sock = sockets[sockets.length - 1]
      sock.join = joinAck
      sock.fire("connect")
      then(sock)
      next()
    }
    document.body.appendChild(s)
  }

  var otherTask = {
    taskId: "task-b",
    mode: "debug",
    isRunning: true,
    tokenUsage: { totalTokensIn: 5000000, totalTokensOut: 100000, totalCost: 9.99, contextTokens: 150000 },
    contextTokens: 150000,
    contextWindow: 200000,
    autoApproval: { autoApprovalEnabled: true, autoApprovalMode: "bypass", alwaysAllowReadOnly: true },
    currentAsk: { ts: 42, type: "ask", ask: "command" },
  }

  scenario(
    // The extension registered and has reported on no task since: the record
    // is its registration only (userId, workspacePath, lastHeartbeat).
    { success: true, instanceOnline: true, instance: { userId: "u1", workspacePath: "/w", lastHeartbeat: 1 } },
    function () {
      check("registration only: tokens in stay the conversation's", text("hdr-own-in") === "297.8k")
      check("registration only: tokens out stay the conversation's", text("hdr-own-out") === "5.9k")
      check("registration only: context stays the conversation's", text("hdr-context") === "32.2k")
      check("registration only: cost stays the conversation's", text("hdr-own-cost") === "$0.1656")
      // The run row is this task's figures plus what the subtasks stored.
      check("run row: this task's total tokens are in plus out", text("hdr-own-tokens") === "303.7k")
      check("run row: tokens in add the subtasks'", text("hdr-run-in") === "3.3M")
      check("run row: cost adds the subtasks'", text("hdr-run-cost") === "$1.4090")
      check("run row: total tokens add the subtasks'", text("hdr-run-tokens") === "3.4M")
      check("registration only: the task is idle", text("task-state") === "Idle" &&
            document.getElementById("task-state").getAttribute("data-state") === "idle")
      check("registration only: no Stop in the header", document.getElementById("head-stop").hidden === true)
      check("registration only: the page is not sent to the tail", window.TumbleFollow.calls === 0)
    },
    function () {
      scenario(
        // The extension last reported on another task.
        { success: true, instanceOnline: true, instance: otherTask },
        function (sock) {
          check("another task's snapshot: its tokens in are not shown", text("hdr-own-in") === "297.8k")
          check("another task's snapshot: its tokens out are not shown", text("hdr-own-out") === "5.9k")
          check("another task's snapshot: its cost is not shown", text("hdr-own-cost") === "$0.1656")
          check("another task's snapshot: nor in the run row", text("hdr-run-cost") === "$1.4090")
          check("another task's snapshot: its context is not shown", text("hdr-context") === "32.2k")
          check("another task's snapshot: its mode is not shown", text("hdr-mode") === "\u2014")
          check("another task's snapshot: its running state does not offer Stop",
                document.getElementById("btn-stop").hidden === true)
          // Auto-approval is the extension's setting, not the task's, and the
          // controls push every toggle at once: they must start from the truth.
          check("another task's snapshot: auto-approval still reflects the extension",
                document.getElementById("auto-enabled").checked === true &&
                document.getElementById("auto-ReadOnly").checked === true &&
                document.getElementById("auto-mode").value === "bypass")

          // A relayed snapshot of THIS task without figures (a mode switch)
          // must not blank the figures already shown.
          sock.fire("task:relayed_event", { type: "instanceState", taskId: "task-a", mode: "ask", isRunning: false })
          check("a snapshot without figures keeps tokens in", text("hdr-own-in") === "297.8k")
          check("a snapshot without figures keeps tokens out", text("hdr-own-out") === "5.9k")
          check("a snapshot without figures keeps the context", text("hdr-context") === "32.2k")
          check("a snapshot without figures still sets the mode", text("hdr-mode") === "ask")
          check("another task running, this one idle: the page is not sent to the tail",
                window.TumbleFollow.calls === 0)
        },
        function () {
          scenario(
            // The extension last reported on this very task.
            {
              success: true,
              instanceOnline: true,
              instance: {
                taskId: "task-a",
                mode: "code",
                isRunning: true,
                tokenUsage: { totalTokensIn: 310000, totalTokensOut: 6100, totalCost: 0.1702, contextTokens: 33000 },
                contextTokens: 33000,
                contextWindow: 200000,
              },
            },
            function (sock) {
              check("this task's snapshot: tokens in", text("hdr-own-in") === "310k")
              check("this task's snapshot: tokens out", text("hdr-own-out") === "6.1k")
              check("this task's snapshot: cost", text("hdr-own-cost") === "$0.1702")
              check("this task's snapshot: the run row follows it",
                    text("hdr-run-cost") === "$1.4136" && text("hdr-run-in") === "3.3M")
              check("this task's snapshot: the subtasks row is left as rendered",
                    text("hdr-subtasks-cost") === "$1.2434")
              check("this task's snapshot: context against the window", text("hdr-context") === "33k / 200k")
              check("this task's snapshot: mode", text("hdr-mode") === "code")
              check("this task's snapshot: running offers Stop",
                    document.getElementById("btn-stop").hidden === false)
              check("this task running: the page opens at its tail", window.TumbleFollow.calls === 1)
              check("this task running: the header says Working", text("task-state") === "Working" &&
                    document.getElementById("task-state").getAttribute("data-state") === "running")
              check("this task running: the header offers Stop", document.getElementById("head-stop").hidden === false)
              check("the Details summary repeats the run row and the mode",
                    text("sum-tokens") === text("hdr-run-tokens") && text("sum-cost") === "$1.4136" &&
                    text("sum-mode") === "code")
              document.getElementById("head-stop").click()
              var stops = sock.emitted.filter(function (e) { return e.evt === "task:command" && e.payload.type === "stop_task" })
              check("the header's Stop stops the task", stops.length === 1 && stops[0].payload.taskId === "task-a")
              sock.fire("task:relayed_event", { type: "instanceState", taskId: "task-a", isRunning: true })
              check("a later running snapshot does not move the page again", window.TumbleFollow.calls === 1)

              // Every load so far bound its own handler to the fold button;
              // the next scenario gets a fresh one, so exactly one is bound.
              ;["auto-more", "details-toggle"].forEach(function (id) {
                var old = document.getElementById(id)
                old.parentNode.replaceChild(old.cloneNode(true), old)
              })
            },
            function () {
              scenario(
                { success: true, instanceOnline: true, instance: null },
                function () {
                  // The phone fold for the auto-approval row: a click opens it
                  // and says so, the next closes it.
                  var controls = document.getElementById("live-controls")
                  var more = document.getElementById("auto-more")
                  more.click()
                  check("the auto-approval fold opens", controls.classList.contains("show-auto") &&
                        more.getAttribute("aria-expanded") === "true")
                  more.click()
                  check("the auto-approval fold closes", !controls.classList.contains("show-auto") &&
                        more.getAttribute("aria-expanded") === "false")
                  // The phone's Details fold, on the header.
                  var header = document.getElementById("detail-header")
                  var details = document.getElementById("details-toggle")
                  details.click()
                  check("the Details fold opens", header.classList.contains("show-details") &&
                        details.getAttribute("aria-expanded") === "true")
                  details.click()
                  check("the Details fold closes", !header.classList.contains("show-details") &&
                        details.getAttribute("aria-expanded") === "false")
                },
                function () {
                  // Earlier loads of live.js still listen on the controls;
                  // a fresh copy leaves only the next one bound.
                  var old = document.getElementById("live-controls")
                  old.parentNode.replaceChild(old.cloneNode(true), old)
                  scenario(
                    { success: true, instanceOnline: true, instance: { taskId: "task-a", isRunning: true, currentAsk: followup(100) } },
                    askDockChecks,
                    finish,
                  )
                },
              )
            },
          )
        },
      )
    },
  )

  function followup(ts) {
    return {
      ts: ts, type: "ask", ask: "followup",
      text: JSON.stringify({
        question: "Which **one**?",
        suggest: [{ answer: "Use `a`", mode: "code" }, "Plain b", { answer: "  " }],
      }),
    }
  }

  function askDockChecks(sock) {
    var convo = window.__tumbleConversation
    var dock = document.getElementById("ask-dock")
    var input = document.getElementById("chat-input")
    function lastCall(name) {
      for (var i = convo.calls.length - 1; i >= 0; i--) if (convo.calls[i][0] === name) return convo.calls[i]
      return null
    }
    function lastCommand() {
      var cmds = sock.emitted.filter(function (e) { return e.evt === "task:command" })
      return cmds.length ? cmds[cmds.length - 1].payload : null
    }
    function ask(a) { sock.fire("task:relayed_event", { type: "instanceState", taskId: "task-a", currentAsk: a }) }
    function buttons() { return dock.querySelectorAll("#ask-dock-suggestions button") }

    // A followup: the question, a button per usable suggestion, the composer as the own answer.
    check("followup: the dock shows", dock.hidden === false && text("ask-dock-kind") === "Question")
    check("followup: the question is Markdown",
          document.getElementById("ask-dock-question").innerHTML.indexOf("<strong>one</strong>") >= 0)
    check("followup: a button per usable suggestion", buttons().length === 2)
    check("followup: a suggestion is inline Markdown", buttons()[0].innerHTML.indexOf("<code>a</code>") >= 0)
    check("followup: a suggestion names the mode it switches to",
          buttons()[0].querySelector(".suggestion-mode").textContent === "→ code mode" &&
          !buttons()[1].querySelector(".suggestion-mode"))
    check("followup: its row is marked", (lastCall("setActiveAsk") || [])[1] === 100)
    check("followup: the composer asks for an answer", input.placeholder === "Your answer… (or pick one above)")
    check("a pending question outranks running in the header", text("task-state") === "Waiting for you")

    buttons()[0].click()
    var cmd = lastCommand()
    check("a suggestion is sent as the answer, with its mode",
          cmd.type === "message" && cmd.payload.text === "Use `a`" && cmd.payload.mode === "code")
    check("a suggestion marks the row answered with its text",
          JSON.stringify(lastCall("markResolved")) === JSON.stringify(["markResolved", 100, "answered", "Use `a`"]))
    check("an answered question leaves the dock", dock.hidden === true && input.placeholder === "Message the task…")
    check("answered: the header is back to Working", text("task-state") === "Working")
    ask(followup(100))
    check("a stale snapshot does not bring the answered question back", dock.hidden === true)

    ask({ ts: 150, type: "ask", ask: "command_output", text: "" })
    check("a running command's Continue does not read as waiting", dock.hidden === false && text("task-state") === "Working")

    ask(followup(101))
    input.value = "  my own  "
    document.getElementById("btn-send").click()
    cmd = lastCommand()
    check("Send during a followup answers it", cmd.type === "message" && cmd.payload.text === "my own" &&
          !("mode" in cmd.payload) && (lastCall("markResolved") || [])[1] === 101 && dock.hidden === true)

    // An approval: the VS Code labels, the composer text as the comment.
    ask({ ts: 102, type: "ask", ask: "command", text: "npm test" })
    check("command: Run and Deny", text("ask-dock-approve") === "Run" && text("ask-dock-deny") === "Deny" &&
          document.getElementById("ask-dock-deny").hidden === false && dock.hidden === false)
    check("command: the command is shown", text("ask-dock-detail") === "npm test")
    check("command: the composer offers a comment", input.placeholder === "Optional comment for Run / Deny…")
    check("command: no suggestions", document.getElementById("ask-dock-suggestions").hidden === true)
    input.value = "careful"
    document.getElementById("ask-dock-approve").click()
    cmd = lastCommand()
    check("approve carries the composer text", cmd.type === "approve_ask" && cmd.payload.text === "careful" && input.value === "")
    check("approve marks the row approved", (lastCall("markResolved") || [])[2] === "approved")

    ask({ ts: 103, type: "ask", ask: "tool", text: JSON.stringify({ tool: "appliedDiff", path: "a.ts" }) })
    check("edit tool: Save and Deny", text("ask-dock-approve") === "Save" && text("ask-dock-deny") === "Deny")
    check("edit tool: the tool and its file", text("ask-dock-detail") === "appliedDiff a.ts")
    document.getElementById("ask-dock-deny").click()
    cmd = lastCommand()
    check("deny with an empty composer sends no text", cmd.type === "deny_ask" && !("text" in cmd.payload))

    ask({ ts: 104, type: "ask", ask: "api_req_failed", text: "502 Bad Gateway" })
    check("failed request: Retry only", text("ask-dock-approve") === "Retry" &&
          document.getElementById("ask-dock-deny").hidden === true && input.placeholder === "Message the task…")

    ask({ ts: 105, type: "ask", ask: "completion_result", text: "" })
    check("a finished task gets no dock", dock.hidden === true && lastCall("clearActiveAsk") === convo.calls[convo.calls.length - 1])
    sock.fire("task:relayed_event", { type: "instanceState", taskId: "task-a", isRunning: false, currentAsk: { ts: 105, type: "ask", ask: "completion_result", text: "" } })
    check("a finished task says Done", text("task-state") === "Done" && document.getElementById("head-stop").hidden === true)

    ask({ ts: 106, type: "ask", ask: "command", text: "ls" })
    document.getElementById("ask-dock-jump").click()
    check("the jump reveals the ask's row", (lastCall("revealRow") || [])[1] === 106)
    sock.fire("disconnect")
    check("offline: the dock's buttons are off", document.getElementById("ask-dock-approve").disabled === true)
    check("offline: the header says so", text("task-state") === "Offline" &&
          document.getElementById("task-state").getAttribute("data-state") === "offline")
  }

  function finish() {
                  var pre = document.createElement("pre")
                  pre.id = "results"
                  pre.textContent = out.join("\n") + "\nTOTAL_FAILURES=" + fail
                  document.body.appendChild(pre)
  }
})
</script>
</body></html>
